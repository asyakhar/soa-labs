page:
  name: page
  in: query
  description: Номер страницы с 0. Фильтрация и сортировка выполняются до пагинации. За пределами выборки возвращается пустой массив.
  required: false
  schema:
    type: integer
    format: int32
    default: 0
    minimum: 0
size:
  name: size
  in: query
  description: Максимальное количество элементов на странице.
  required: false
  schema:
    type: integer
    format: int32
    default: 10
    minimum: 1
    maximum: 100
sort:
  name: sort
  in: query
  description: |
    Сортировка задаётся в формате `поле,направление`, где направление —
    `asc` или `desc`. Для сортировки по нескольким полям параметр
    передаётся несколько раз: `?sort=price,desc&sort=name,asc`.
    Вложенные поля записываются через точку, например `coordinates.x`
    или `event.name`.
  required: false
  style: form
  explode: true
  schema:
    type: array
    minItems: 1
    items:
      type: string
  examples:
    multiple:
      summary: Сначала цена по убыванию, затем название
      value: ['price,desc', 'name,asc']
filter:
  name: filter
  in: query
  required: false
  description: |
    Условие задаётся в формате `поле:оператор:значение`.
    Несколько параметров filter объединяются операцией AND.
    Поддерживаются операторы `eq`, `ne`, `gt`, `gte`, `lt`, `lte`,
    `contains` и `isnull`. Вложенные поля записываются через точку.
    Пример: `?filter=price:gte:100&filter=type:eq:VIP`.
  style: form
  explode: true
  schema:
    type: array
    minItems: 1
    items:
      type: string
  example: ['price:gte:100', 'type:gt:USUAL']
