openapi: 3.0.3
info:
  title: Сервис управления и продажи билетов
  description: |
    Спецификация сервиса управления билетами и сервиса бронирования.
    Все параметры операций передаются в URL. В POST, PUT и PATCH данные Ticket
    передаются в query-параметре `ticket` как JSON.
    Поля id, creationDate и event.id генерируются сервером.
  version: 1.0.0
  contact:
    name: Nostya && Dasha
servers:
  - url: /api/v1
    description: Основной сервис управления коллекцией билетов
tags:
  - name: Tickets
    description: Базовые операции над коллекцией билетов
  - name: Ticket queries
    description: Специальные операции выборки билетов
  - name: Booking
    description: Продажа билетов и отмена бронирований
paths:
  /tickets:
    get:
      tags:
        - Tickets
      summary: Получить список билетов
      description: Возвращает массив билетов
      operationId: getTickets
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: Массив билетов успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '422':
          description: >-
            page и size должны быть целыми числами в допустимых диапазонах; sort и filter должны
            содержать поддерживаемые поля, направления и операторы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: size должен быть от 1 до 100; получено 101.
                path: /api/v1/tickets
                violations:
                  - field: size
                    message: size должен быть от 1 до 100; получено 101.
    post:
      tags:
        - Tickets
      summary: Добавить новый билет
      description: Создаёт новый объект Ticket и добавляет его в коллекцию
      operationId: createTicket
      parameters:
        - $ref: '#/components/parameters/ticket'
      responses:
        '201':
          description: Билет успешно создан
          headers:
            Location:
              description: URL созданного билета
              schema:
                type: string
              example: /api/v1/tickets/10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: >-
            Сервер не смог разобрать запрос: обязательный query-параметр ticket отсутствует,
            содержит некорректное percent-encoding или не является синтаксически корректным JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 400
                error: Bad Request
                message: >-
                  В значении ticket после последнего свойства отсутствует закрывающая фигурная
                  скобка.
                path: /api/v1/tickets
                violations:
                  - field: ticket
                    message: >-
                      В значении ticket после последнего свойства отсутствует закрывающая фигурная
                      скобка.
        '422':
          description: >-
            Обязательные поля Ticket нарушены их типы, диапазоны, значения enum или
            максимальная длина comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: price должен быть числом больше 0; получено -10.
                path: /api/v1/tickets
                violations:
                  - field: ticket.price
                    message: price должен быть числом больше 0; получено -10.
    options:
      tags:
        - Tickets
      summary: Получить разрешённые методы коллекции
      description: >-
        Возвращает Allow со списком методов для /tickets. Это описание возможностей ресурса, не
        настройка CORS.
      operationId: optionsTickets
      responses:
        '204':
          description: Методы перечислены в Allow; тело отсутствует.
          headers:
            Allow:
              description: HTTP-методы, поддерживаемые ресурсом /tickets.
              schema:
                type: string
              example: GET, POST, OPTIONS
  /tickets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Уникальный идентификатор билета
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 10
    get:
      tags:
        - Tickets
      summary: Получить билет по идентификатору
      description: |
        Возвращает билет по идентификатору. Если значение If-None-Match
        совпадает с текущим ETag билета, сервис возвращает 304 без тела.
      operationId: getTicketById
      responses:
        '200':
          description: Билет успешно найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          headers:
            ETag:
              description: Тег текущего представления билета. Меняется при изменении представления.
              schema:
                type: string
              example: '"ticket-10-v1"'
        '304':
          description: >-
            Билет не изменился с момента предыдущего запроса
          headers:
            ETag:
              description: Версия текущего представления билета
              schema:
                type: string
              example: '"ticket-10-v1"'
        '404':
          description: В коллекции билетов отсутствует билет с указанным идентификатором.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 404
                error: Not Found
                message: Билет с id 10 не найден.
                path: /api/v1/tickets/10
        '422':
          description: Параметр id должен быть целым числом int64 больше 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: id должен быть целым числом больше 0; получено -1.
                path: /api/v1/tickets/-1
                violations:
                  - field: id
                    message: id должен быть целым числом больше 0; получено -1.
      parameters:
        - $ref: '#/components/parameters/ifNoneMatch'
    put:
      tags:
        - Tickets
      summary: Обновить билет
      description: |
        Полностью обновляет изменяемые поля билета с указанным идентификатором.
        id и creationDate сохраняются. Если поля event совпадают с текущими,
        event.id сохраняется; иначе сервер создаёт мероприятие с новым event.id.
        Если event отсутствует или равен null, связь удаляется.
      operationId: updateTicket
      parameters:
        - $ref: '#/components/parameters/ticket'
      responses:
        '200':
          description: Билет успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: >-
            Сервер не смог разобрать запрос: path-параметр id невозможно преобразовать в int64 либо
            обязательный query-параметр ticket отсутствует, содержит некорректное percent-encoding
            или не является синтаксически корректным JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 400
                error: Bad Request
                message: >-
                  В значении ticket после последнего свойства отсутствует закрывающая фигурная
                  скобка.
                path: /api/v1/tickets/10
                violations:
                  - field: ticket
                    message: >-
                      В значении ticket после последнего свойства отсутствует закрывающая фигурная
                      скобка.
        '404':
          description: В коллекции билетов отсутствует билет с указанным идентификатором.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 404
                error: Not Found
                message: Билет с id 10 не найден.
                path: /api/v1/tickets/10
        '422':
          description: >-
            id должен быть целым int64 больше 0, а поля Ticket должны соответствовать ограничениям
            схемы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: price должен быть числом больше 0; получено -10.
                path: /api/v1/tickets
                violations:
                  - field: ticket.price
                    message: price должен быть числом больше 0; получено -10.
    patch:
      tags:
        - Tickets
      summary: Частично обновить билет
      description: >-
        Обновляет только переданные поля билета. Остальные поля сохраняют прежние значения. Поля id,
        creationDate и event.id изменять нельзя.
      operationId: patchTicket
      parameters:
        - $ref: '#/components/parameters/ticketPatch'
      responses:
        '200':
          description: Билет успешно частично обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: >-
            Сервер не смог разобрать запрос: path-параметр id невозможно преобразовать в int64 либо
            обязательный query-параметр ticket отсутствует, содержит некорректное percent-encoding
            или не является синтаксически корректным JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 400
                error: Bad Request
                message: Параметр ticket содержит неразбираемый JSON.
                path: /api/v1/tickets/10
                violations:
                  - field: ticket
                    message: Параметр ticket содержит неразбираемый JSON.
        '404':
          description: В коллекции билетов отсутствует билет с указанным идентификатором.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 404
                error: Not Found
                message: Билет с id 10 не найден.
                path: /api/v1/tickets/10
        '422':
          description: >-
            id должен быть целым int64 больше 0, а переданные поля должны соответствовать схеме
            TicketPatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: price должен быть числом больше 0; получено -10.
                path: /api/v1/tickets/10
                violations:
                  - field: ticket.price
                    message: price должен быть числом больше 0; получено -10.
    delete:
      tags:
        - Tickets
      summary: Удалить билет
      description: >-
        Удаляет билет с указанным id. Если билет уже удалён или никогда не существовал, также
        возвращает 204 без тела. Повторный вызов сохраняет состояние отсутствия билета.
      operationId: deleteTicket
      responses:
        '204':
          description: >-
            Билет отсутствует в коллекции: удалён этим запросом или отсутствовал до запроса. Тело
            ответа отсутствует.
        '400':
          description: >-
            Сервер не смог разобрать запрос: path-параметр id невозможно преобразовать в int64,
            например, передано буквенное или дробное значение либо число за пределами int64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 400
                error: Bad Request
                message: Параметр id невозможно преобразовать в int64; получено abc.
                path: /api/v1/tickets/abc
                violations:
                  - field: id
                    message: Параметр id невозможно преобразовать в int64; получено abc.
        '422':
          description: Параметр id должен быть целым числом int64 больше 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: id должен быть целым числом больше 0; получено -1.
                path: /api/v1/tickets/-1
                violations:
                  - field: id
                    message: id должен быть целым числом больше 0; получено -1.
  /tickets/max-type:
    get:
      tags:
        - Ticket queries
      summary: Получить билет с максимальным типом
      description: |
        Возвращает один любой билет, поле `type` которого имеет
        максимальное значение среди всех билетов коллекции.

        Значения сравниваются в порядке объявления перечисления:
        `VIP < USUAL < BUDGETARY < CHEAP`.

        Если максимальный тип имеют несколько билетов, сервис может
        вернуть любой из них.
      operationId: getTicketWithMaxType
      responses:
        '200':
          description: Билет с максимальным значением поля type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: Коллекция билетов пуста, поэтому определить билет с максимальным type невозможно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 404
                error: Not Found
                message: Коллекция билетов пуста.
                path: /api/v1/tickets/max-type
  /tickets/comment-contains:
    get:
      tags:
        - Ticket queries
      summary: Найти билеты по подстроке в комментарии
      description: |
        Возвращает массив билетов, поле "comment" которых содержит
        заданную подстроку
      operationId: getTicketsByCommentSubstring
      parameters:
        - name: substring
          in: query
          required: true
          description: Подстрока, которую должно содержать поле comment
          schema:
            type: string
            minLength: 1
          example: сцена
      responses:
        '200':
          description: Массив найденных билетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '422':
          description: Обязательный параметр substring отсутствует или является пустой строкой.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: substring должен содержать хотя бы один символ.
                path: /api/v1/tickets/comment-contains
                violations:
                  - field: substring
                    message: substring должен содержать хотя бы один символ.
  /tickets/type-greater-than:
    get:
      tags:
        - Ticket queries
      summary: Получить билеты с типом больше заданного
      description: |
        Возвращает массив билетов, значение поля `type` которых больше
        переданного значения
      operationId: getTicketsWithTypeGreaterThan
      parameters:
        - name: type
          in: query
          required: true
          description: Тип билета, с которым выполняется сравнение
          schema:
            $ref: '#/components/schemas/TicketType'
          example: USUAL
      responses:
        '200':
          description: Массив билетов с типом больше заданного
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '422':
          description: >-
            Обязательный параметр type отсутствует или не равен VIP, USUAL, BUDGETARY либо CHEAP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: type должен быть VIP, USUAL, BUDGETARY или CHEAP; получено STANDARD.
                path: /api/v1/tickets/type-greater-than
                violations:
                  - field: type
                    message: type должен быть VIP, USUAL, BUDGETARY или CHEAP; получено STANDARD.
  /sell/{ticket-id}/{person-id}/{price}:
    servers:
      - url: /booking
        description: Сервис продажи билетов и отмены бронирований
    post:
      tags:
        - Booking
      summary: Продать билет
      description: |
        Продаёт указанный билет указанному человеку за переданную сумму.
                Для выполнения операции используется API первого сервиса.
      operationId: sellTicket
      parameters:
        - name: ticket-id
          in: path
          required: true
          description: Идентификатор продаваемого билета
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 10
        - name: person-id
          in: path
          required: true
          description: Идентификатор человека, которому продаётся билет
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 42
        - name: price
          in: path
          required: true
          description: Сумма продажи билета
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
          example: 2500.5
      responses:
        '204':
          description: Билет успешно продан
        '400':
          description: >-
            Сервер не смог разобрать запрос: ticket-id или person-id невозможно преобразовать в
            int64 либо price невозможно преобразовать в число double.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 400
                error: Bad Request
                message: Параметр price невозможно преобразовать в double; получено abc.
                path: /booking/sell/10/42/abc
                violations:
                  - field: price
                    message: Параметр price невозможно преобразовать в double; получено abc.
        '404':
          description: В коллекции билетов отсутствует билет с указанным идентификатором.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 404
                error: Not Found
                message: Билет с id 10 не найден.
                path: /booking/sell/10/42/100
        '409':
          description: >-
            Для ticket-id уже существует связь с владельцем, включая того же person-id. Повторная
            продажа не выполняется.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 409
                error: Conflict
                message: Билет с id 10 уже продан.
                path: /booking/sell/10/42/100
        '422':
          description: >-
            ticket-id и person-id должны быть целыми int64 больше 0, price — числом больше 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: price должен быть больше 0; получено 0.
                path: /booking/sell/10/42/0
                violations:
                  - field: price
                    message: price должен быть больше 0; получено 0.
  /person/{person-id}/cancel:
    servers:
      - url: /booking
        description: Сервис продажи билетов и отмены бронирований
    delete:
      tags:
        - Booking
      summary: Отменить все бронирования человека
      description: |
        Отменяет все бронирования указанного человека, удаляя его
        идентификатор из всех связанных билетов через API первого сервиса.
      operationId: cancelPersonBookings
      parameters:
        - name: person-id
          in: path
          required: true
          description: Идентификатор человека
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Все бронирования человека успешно отменены
        '400':
          description: >-
            Сервер не смог разобрать запрос: path-параметр person-id невозможно преобразовать в
            int64, например, передано буквенное или дробное значение либо число за пределами int64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 400
                error: Bad Request
                message: Параметр person-id невозможно преобразовать в int64; получено abc.
                path: /booking/person/abc/cancel
                violations:
                  - field: person-id
                    message: Параметр person-id невозможно преобразовать в int64; получено abc.
        '422':
          description: Параметр person-id должен быть целым числом int64 больше 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: person-id должен быть целым числом больше 0; получено -1.
                path: /booking/person/-1/cancel
                violations:
                  - field: person-id
                    message: person-id должен быть целым числом больше 0; получено -1.
components:
  schemas:
    Ticket:
      $ref: ./components/schemas/Ticket.yaml
    TicketPatch:
      $ref: ./components/schemas/TicketPatch.yaml
    Coordinates:
      $ref: ./components/schemas/Coordinates.yaml
    Event:
      $ref: ./components/schemas/Event.yaml
    TicketType:
      $ref: ./components/schemas/TicketType.yaml
    EventType:
      $ref: ./components/schemas/EventType.yaml
    ErrorResponse:
      $ref: ./components/schemas/ErrorResponse.yaml
  parameters:
    ticket:
      name: ticket
      in: query
      required: true
      description: |
        JSON-объект с изменяемыми полями Ticket, закодированный в URL.
        id, creationDate и event.id не передаются (генерируются сервером).
        event может отсутствовать или быть null. Все остальные изменяемые поля обязательны.
        Swagger UI сериализует JSON и кодирует значение параметра автоматически.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ticket'
          example:
            name: Билет в партер
            coordinates:
              x: 10.5
              'y': 20
            price: 2500.5
            comment: Место рядом со сценой
            type: VIP
            event: null
    ticketPatch:
      name: ticket
      in: query
      required: true
      description: |
        JSON-объект с полями Ticket, которые требуется изменить, закодированный в URL.
        Необходимо передать хотя бы одно поле. id, creationDate и event.id изменять нельзя.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TicketPatch'
          example:
            price: 3000
            comment: Новое место
    page:
      $ref: ./components/parameters/Pagination.yaml#/page
    size:
      $ref: ./components/parameters/Pagination.yaml#/size
    sort:
      $ref: ./components/parameters/Pagination.yaml#/sort
    filter:
      $ref: ./components/parameters/Pagination.yaml#/filter
    ifNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        ETag, полученный в предыдущем ответе
      schema:
        type: string
      example: '"ticket-10-v1"'
