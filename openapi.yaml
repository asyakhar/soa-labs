openapi: 3.0.3
info:
  title: Сервис управления и продажи билетов
  description: |
    Спецификация двух веб-сервисов: управление коллекцией билетов и бронирование.
    Все входные данные передаются в URL. Для POST и PUT объект Ticket передаётся
    как JSON в query-параметре `ticket`, с percent-encoding значения.
    Тела запросов не используются; объекты в ответах представлены в application/json.
    Это буквальное толкование требования лабораторной; в обычном API для создания
    и обновления больших объектов предпочтительно JSON-тело запроса.
    Поля id, creationDate и event.id генерирует сервер; клиент их не передаёт.
    Связь ticket-id → person-id хранится внутри сервиса бронирования,
    поскольку исходный класс Ticket не содержит person-id.
    Здесь опубликована спецификация, а не реализация сервисов.
  version: 1.0.0
  contact: 
    name: Nostya && Dasha
servers: 
  - url: /api/v1
    description: Основной сервис управления коллекцией билетов 
tags:
  - name: Tickets
    description: Базовые операции над коллекцией билетов
  - name: Ticket queries
    description: Специальные операции выборки билетов
  - name: Booking
    description: Продажа билетов и отмена бронирований
paths: 
  /tickets:
    get:
      tags:
        - Tickets
      summary: Получить список билетов
      description: Возвращает массив билетов
      operationId: getTickets
      parameters:
            - $ref: '#/components/parameters/page'
            - $ref: '#/components/parameters/size'
            - $ref: '#/components/parameters/sort'
            - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: Массив билетов успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '400':
          description: Некорректные параметры пагинации, сортировки или фильтрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Tickets
      summary: Добавить новый билет
      description: Создаёт новый объект Ticket и добавляет его в коллекцию
      operationId: createTicket
      parameters:
        - $ref: '#/components/parameters/ticket'
      responses:
        '201':
          description: Билет успешно создан
          headers:
            Location:
              description: URL созданного билета
              schema:
                type: string
              example: /api/v1/tickets/10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

        '400':
          description: Параметр ticket отсутствует или содержит некорректный JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '422':
          description: Данные нарушают ограничения целостности объекта Ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tickets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Уникальный идентификатор билета
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 10

    get:
      tags:
        - Tickets
      summary: Получить билет по идентификатору
      description: Возвращает объект Ticket с указанным идентификатором.
      operationId: getTicketById
      responses:
        '200':
          description: Билет успешно найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

        '400':
          description: Передан некорректный идентификатор билета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Билет с указанным идентификатором не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Tickets
      summary: Обновить билет
      description: |
        Полностью обновляет изменяемые поля билета с указанным идентификатором.
        id и creationDate сохраняются. Если поля event совпадают с текущими,
        event.id сохраняется; иначе сервер создаёт мероприятие с новым event.id.
        Если event отсутствует или равен null, связь удаляется.
      operationId: updateTicket
      parameters:
        - $ref: '#/components/parameters/ticket'

      responses:
        '200':
          description: Билет успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

        '400':
          description: Идентификатор или JSON имеют некорректный формат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Билет с указанным идентификатором не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '422':
          description: Данные нарушают ограничения целостности объекта Ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Tickets
      summary: Удалить билет
      description: Удаляет билет с указанным идентификатором из коллекции.
      operationId: deleteTicket
      responses:
        '204':
          description: Билет успешно удалён

        '400':
          description: Передан некорректный идентификатор билета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Билет с указанным идентификатором не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tickets/max-type:
    get:
      tags:
        - Ticket queries
      summary: Получить билет с максимальным типом
      description: |
        Возвращает один любой билет, поле `type` которого имеет
        максимальное значение среди всех билетов коллекции.

        Значения сравниваются в порядке объявления перечисления:
        `VIP < USUAL < BUDGETARY < CHEAP`.

        Если максимальный тип имеют несколько билетов, сервис может
        вернуть любой из них.
      operationId: getTicketWithMaxType
      responses:
        '200':
          description: Билет с максимальным значением поля type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'

        '404':
          description: Коллекция билетов пуста
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tickets/comment-contains:
    get:
      tags:
        - Ticket queries
      summary: Найти билеты по подстроке в комментарии
      description: |
        Возвращает массив билетов, поле "comment" которых содержит
        заданную подстроку
      operationId: getTicketsByCommentSubstring
      parameters:
        - name: substring
          in: query
          required: true
          description: Подстрока, которую должно содержать поле comment
          schema:
            type: string
            minLength: 1
          example: сцена
      responses:
        '200':
          description: Массив найденных билетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'

        '400':
          description: Подстрока отсутствует или является пустой
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tickets/type-greater-than:
    get:
      tags:
        - Ticket queries
      summary: Получить билеты с типом больше заданного
      description: |
        Возвращает массив билетов, значение поля `type` которых больше
        переданного значения
      operationId: getTicketsWithTypeGreaterThan
      parameters:
        - name: type
          in: query
          required: true
          description: Тип билета, с которым выполняется сравнение
          schema:
            $ref: '#/components/schemas/TicketType'
          example: USUAL
      responses:
        '200':
          description: Массив билетов с типом больше заданного
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'

        '400':
          description: Передано неизвестное или отсутствующее значение типа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sell/{ticket-id}/{person-id}/{price}:
    servers:
      - url: /booking
        description: Сервис продажи билетов и отмены бронирований
    post:
      tags:
        - Booking
      summary: Продать билет
      description: |
        Продаёт указанный билет указанному человеку за переданную сумму.
        Получает билет через GET /api/v1/tickets/{id} и обновляет его price через
        PUT /api/v1/tickets/{id}, передавая изменяемые поля в параметре ticket.
        После успешного обновления сохраняет внутреннюю связь ticket-id → person-id.
        Сбой первого сервиса не должен оставлять новое бронирование.
        Если билет уже связан с человеком, возвращается 409, включая повторную продажу
        тому же человеку. Неизменённое вложенное event сохраняет свой id.
      operationId: sellTicket
      parameters:
        - name: ticket-id
          in: path
          required: true
          description: Идентификатор продаваемого билета
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 10

        - name: person-id
          in: path
          required: true
          description: Идентификатор человека, которому продаётся билет
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 42

        - name: price
          in: path
          required: true
          description: Сумма продажи билета
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
          example: 2500.50

      responses:
        '204':
          description: Билет успешно продан

        '400':
          description: Один или несколько параметров имеют некорректный формат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Билет с указанным идентификатором не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Билет уже продан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '502':
          description: Первый сервис недоступен или вернул некорректный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /person/{person-id}/cancel:
    servers:
      - url: /booking
        description: Сервис продажи билетов и отмены бронирований
    delete:
      tags:
        - Booking
      summary: Отменить все бронирования человека
      description: |
        Отменяет все бронирования указанного человека.
        Получает коллекцию через GET /api/v1/tickets (последовательно по страницам)
        и удаляет все внутренние связи с данным person-id, включая связи удалённых билетов.
        Сами билеты и их price сохраняются. Поле person-id в JSON Ticket не добавляется.
        При сбое первого сервиса связи сохраняются, возвращается 502.
        Повторная отмена и отсутствие бронирований возвращают 204.
      operationId: cancelPersonBookings
      parameters:
        - name: person-id
          in: path
          required: true
          description: Идентификатор человека
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Все бронирования человека успешно отменены

        '400':
          description: Идентификатор человека имеет некорректный формат
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '502':
          description: Первый сервис недоступен или вернул некорректный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Ticket:
      $ref: './components/schemas/Ticket.yaml'
    Coordinates:
      $ref: './components/schemas/Coordinates.yaml'
    Event:
      $ref: './components/schemas/Event.yaml'
    TicketType:
      $ref: './components/schemas/TicketType.yaml'
    EventType:
      $ref: './components/schemas/EventType.yaml'
    ErrorResponse:
      $ref: './components/schemas/ErrorResponse.yaml'

  parameters:
    ticket:
      name: ticket
      in: query
      required: true
      description: |
        JSON-объект с изменяемыми полями Ticket, закодированный в URL.
        id, creationDate и event.id не передаются (генерируются сервером).
        event может отсутствовать или быть null. Все остальные изменяемые поля обязательны.
        Swagger UI сериализует JSON и кодирует значение параметра автоматически.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ticket'
          example:
            name: Билет в партер
            coordinates: {x: 10.5, y: 20}
            price: 2500.5
            comment: Место рядом со сценой
            type: VIP
            event: null
    page:
      $ref: './components/parameters/Pagination.yaml#/page'
    size:
      $ref: './components/parameters/Pagination.yaml#/size'
    sort:
      $ref: './components/parameters/Pagination.yaml#/sort'
    filter:
      $ref: './components/parameters/Pagination.yaml#/filter'
