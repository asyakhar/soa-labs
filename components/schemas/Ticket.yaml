type: object
description: Билет
properties:
  id:
    type: integer
    format: int64
    minimum: 1
    readOnly: true
    description: Уникальный автоматически генерируемый идентификатор билета
    example: 10
  name:
    type: string
    minLength: 1
    description: Название билета. Строка не может быть пустой
    example: Билет в партер
  coordinates:
    $ref: ./Coordinates.yaml
  creationDate:
    type: string
    pattern: >-
      ^(0[1-9]|[12][0-9]|3[01])\.(0[1-9]|1[0-2])\.\d{4}
      ([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.\d{1,9})?$
    readOnly: true
    description: >-
      Дата и время создания, генерируются сервером. Формат dd.MM.yyyy HH:mm:ss с необязательными
      долями секунды (1–9 цифр), без часового пояса. Пример: 21 сентября 2026, 14:30. Календарную
      корректность проверяет сервер.
    example: 21.09.2026 14:30:00
  price:
    type: number
    format: double
    minimum: 0
    exclusiveMinimum: true
    description: Цена билета. Значение должно быть больше 0
    example: 2500.5
  comment:
    type: string
    description: Комментарий к билету. Поле не может быть null
    example: Место рядом со сценой
  type:
    $ref: ./TicketType.yaml
  event:
    $ref: ./Event.yaml
required:
  - id
  - name
  - coordinates
  - creationDate
  - price
  - comment
  - type
title: Билет
