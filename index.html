<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Ticket Service API</title>

    <link
            rel="stylesheet"
            href="./vendor/swagger-ui/swagger-ui.css"
    >

    <style>
        html {
          box-sizing: border-box;
          overflow-y: scroll;
        }

        *,
        *::before,
        *::after {
          box-sizing: inherit;
        }

        body {
          margin: 0;
          background: #fafafa;
        }
    </style>
</head>

<body>
<div id="swagger-ui"></div>

<script src="./vendor/swagger-ui/swagger-ui-bundle.js"></script>
<script src="./vendor/swagger-ui/swagger-ui-standalone-preset.js"></script>

<script>
    window.onload = function () {
      SwaggerUIBundle({
        url: "./openapi.bundle.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        filter: true,
        tryItOutEnabled: true,
        validatorUrl: null,

        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],

        layout: "StandaloneLayout"
      });
    };
</script>
</body>
</html>
