type: object 
properties:
  id:
    type: integer
    format: int64 
    minimum: 1 
    readonly: true 
    description: Уникальный ID билета
  name: 
    type: string 
    minlength: 1
    description: Название билета
  coordinates:
    ref$: './Coordinates.yaml'
  creationDate:
    type: string 
    format: date-time
    readonly: true
    description: Дата создания 
  price:
    type: integer
    format: int64 
    minimum: 1
    description: Цена билета
  comment: 
    type: string
    minLength: 1
    description: Комментарий к билету
  type: 
    - $ref: './TicketType.yaml'
  event:
    oneOf: 
      - $ref: './Event.yaml'
      - type: 'null'
required:
   - id
   - name 
   - coordinates 
   - creationDate 
   - price 
   - comment
   - type