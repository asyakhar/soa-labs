openapi: 3.0.3
info:
  title: Сервис управления и продажи билетов
  description: |
    Спецификация сервиса управления билетами и сервиса бронирования.
    Все параметры операций передаются в URL. В POST и PUT данные Ticket
    передаются в query-параметре `ticket` как JSON.
    Поля id, creationDate и event.id генерируются сервером.
  version: 1.0.0
  contact:
    name: Nostya && Dasha
servers:
  - url: /api/v1
    description: Основной сервис управления коллекцией билетов
tags:
  - name: Tickets
    description: Базовые операции над коллекцией билетов
  - name: Ticket queries
    description: Специальные операции выборки билетов
  - name: Booking
    description: Продажа билетов и отмена бронирований
paths:
  /tickets:
    get:
      tags:
        - Tickets
      summary: Получить список билетов
      description: Возвращает массив билетов
      operationId: getTickets
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/filter'
      responses:
        '200':
          description: Массив билетов успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '422':
          description: >-
            page должен быть целым int32 ≥ 0, size — целым от 1 до 100. Поле sort/filter должно
            входить в перечисленные поля Ticket; направление sort — asc или desc, оператор filter
            должен поддерживать тип поля, значение — соответствовать его типу. Нарушение любого из
            этих условий возвращает 422.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: size должен быть от 1 до 100; получено 101.
                path: /api/v1/tickets
                violations:
                  - field: size
                    message: size должен быть от 1 до 100; получено 101.
    post:
      tags:
        - Tickets
      summary: Добавить новый билет
      description: Создаёт новый объект Ticket и добавляет его в коллекцию
      operationId: createTicket
      parameters:
        - $ref: '#/components/parameters/ticket'
      responses:
        '201':
          description: Билет успешно создан
          headers:
            Location:
              description: URL созданного билета
              schema:
                type: string
              example: /api/v1/tickets/10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: >-
            Параметр ticket отсутствует, содержит незавершённый JSON-текст (например, отсутствует
            закрывающая фигурная скобка), имя свойства без двойных кавычек либо недопустимую
            последовательность percent-encoding. Разбор запроса прекращён до проверки модели.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 400
                error: Bad Request
                message: >-
                  В значении ticket после последнего свойства отсутствует закрывающая фигурная
                  скобка.
                path: /api/v1/tickets
                violations:
                  - field: ticket
                    message: >-
                      В значении ticket после последнего свойства отсутствует закрывающая фигурная
                      скобка.
        '422':
          description: >-
            Нарушена схема Ticket: name отсутствует, равен null или пуст; coordinates отсутствует
            или равен null; x не число или ≤ -239; y не целое int64 или ≤ -495; price не число или ≤
            0; comment отсутствует или равен null или длиннее 341 символа; type не входит в VIP, USUAL,
            BUDGETARY, CHEAP или равен null. Если event задан: name обязателен и непуст,
            ticketsCount — целое int32 > 0, eventType — CONCERT, BASKETBALL, OPERA или null. Типы
            всех полей должны соответствовать схеме; генерируемые поля передавать нельзя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: price должен быть числом больше 0; получено -10.
                path: /api/v1/tickets
                violations:
                  - field: ticket.price
                    message: price должен быть числом больше 0; получено -10.
    options:
      tags:
        - Tickets
      summary: Получить разрешённые методы коллекции
      description: >-
        Возвращает Allow со списком методов для /tickets. Это описание возможностей ресурса, не
        настройка CORS.
      operationId: optionsTickets
      responses:
        '204':
          description: Методы перечислены в Allow; тело отсутствует.
          headers:
            Allow:
              description: HTTP-методы, поддерживаемые ресурсом /tickets.
              schema:
                type: string
              example: GET, POST, OPTIONS
  /tickets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Уникальный идентификатор билета
        schema:
          type: integer
          format: int64
          minimum: 1
        example: 10
    get:
      tags:
        - Tickets
      summary: Получить билет по идентификатору
      description: |
        Возвращает билет по идентификатору. Если значение If-None-Match
        совпадает с текущим ETag билета, сервис возвращает 304 без тела.
      operationId: getTicketById
      responses:
        '200':
          description: Билет успешно найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          headers:
            ETag:
              description: Тег текущего представления билета. Меняется при изменении представления.
              schema:
                type: string
              example: '"ticket-10-v1"'
        '304':
          description: >-
            Билет не изменился с момента предыдущего запроса
          headers:
            ETag:
              description: Версия текущего представления билета
              schema:
                type: string
              example: '"ticket-10-v1"'
        '404':
          description: Билет с переданным положительным id отсутствует в коллекции.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 404
                error: Not Found
                message: Билет с id 10 не найден.
                path: /api/v1/tickets/10
        '422':
          description: >-
            Параметр id должен быть целым числом int64 больше 0; передано буквенное, дробное,
            неположительное значение или число за пределами int64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: id должен быть целым числом больше 0; получено -1.
                path: /api/v1/tickets/-1
                violations:
                  - field: id
                    message: id должен быть целым числом больше 0; получено -1.
      parameters:
        - $ref: '#/components/parameters/ifNoneMatch'
    put:
      tags:
        - Tickets
      summary: Обновить билет
      description: |
        Полностью обновляет изменяемые поля билета с указанным идентификатором.
        id и creationDate сохраняются. Если поля event совпадают с текущими,
        event.id сохраняется; иначе сервер создаёт мероприятие с новым event.id.
        Если event отсутствует или равен null, связь удаляется.
      operationId: updateTicket
      parameters:
        - $ref: '#/components/parameters/ticket'
      responses:
        '200':
          description: Билет успешно обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          description: >-
            Параметр ticket отсутствует, содержит незавершённый JSON-текст (например, отсутствует
            закрывающая фигурная скобка), имя свойства без двойных кавычек либо недопустимую
            последовательность percent-encoding. Разбор запроса прекращён до проверки модели.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 400
                error: Bad Request
                message: >-
                  В значении ticket после последнего свойства отсутствует закрывающая фигурная
                  скобка.
                path: /api/v1/tickets
                violations:
                  - field: ticket
                    message: >-
                      В значении ticket после последнего свойства отсутствует закрывающая фигурная
                      скобка.
        '404':
          description: Билет с переданным положительным id отсутствует в коллекции.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 404
                error: Not Found
                message: Билет с id 10 не найден.
                path: /api/v1/tickets/10
        '422':
          description: >-
            Нарушена схема Ticket: name отсутствует, равен null или пуст; coordinates отсутствует
            или равен null; x не число или ≤ -239; y не целое int64 или ≤ -495; price не число или ≤
            0; comment отсутствует, равен null или длиннее 341 символа; type не входит в VIP, USUAL,
            BUDGETARY, CHEAP или равен null. Если event задан: name обязателен и непуст,
            ticketsCount — целое int32 > 0, eventType — CONCERT, BASKETBALL, OPERA или null. Типы
            всех полей должны соответствовать схеме; генерируемые поля передавать нельзя. Параметр
            id должен быть целым числом int64 больше 0; передано буквенное, дробное, неположительное
            значение или число за пределами int64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: price должен быть числом больше 0; получено -10.
                path: /api/v1/tickets
                violations:
                  - field: ticket.price
                    message: price должен быть числом больше 0; получено -10.
    delete:
      tags:
        - Tickets
      summary: Удалить билет
      description: >-
        Удаляет билет с указанным id. Если билет уже удалён или никогда не существовал, также
        возвращает 204 без тела. Повторный вызов сохраняет состояние отсутствия билета.
      operationId: deleteTicket
      responses:
        '204':
          description: >-
            Билет отсутствует в коллекции: удалён этим запросом или отсутствовал до запроса. Тело
            ответа отсутствует.
        '422':
          description: >-
            Параметр id должен быть целым числом int64 больше 0; передано буквенное, дробное,
            неположительное значение или число за пределами int64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: id должен быть целым числом больше 0; получено -1.
                path: /api/v1/tickets/-1
                violations:
                  - field: id
                    message: id должен быть целым числом больше 0; получено -1.
  /tickets/max-type:
    get:
      tags:
        - Ticket queries
      summary: Получить билет с максимальным типом
      description: |
        Возвращает один любой билет, поле `type` которого имеет
        максимальное значение среди всех билетов коллекции.

        Значения сравниваются в порядке объявления перечисления:
        `VIP < USUAL < BUDGETARY < CHEAP`.

        Если максимальный тип имеют несколько билетов, сервис может
        вернуть любой из них.
      operationId: getTicketWithMaxType
      responses:
        '200':
          description: Билет с максимальным значением поля type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          description: В коллекции нет ни одного билета; объект с максимальным type выбрать невозможно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 404
                error: Not Found
                message: Коллекция билетов пуста.
                path: /api/v1/tickets/max-type
  /tickets/comment-contains:
    get:
      tags:
        - Ticket queries
      summary: Найти билеты по подстроке в комментарии
      description: |
        Возвращает массив билетов, поле "comment" которых содержит
        заданную подстроку
      operationId: getTicketsByCommentSubstring
      parameters:
        - name: substring
          in: query
          required: true
          description: Подстрока, которую должно содержать поле comment
          schema:
            type: string
            minLength: 1
          example: сцена
      responses:
        '200':
          description: Массив найденных билетов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '422':
          description: Обязательный query-параметр substring отсутствует или содержит строку длиной 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: substring должен содержать хотя бы один символ.
                path: /api/v1/tickets/comment-contains
                violations:
                  - field: substring
                    message: substring должен содержать хотя бы один символ.
  /tickets/type-greater-than:
    get:
      tags:
        - Ticket queries
      summary: Получить билеты с типом больше заданного
      description: |
        Возвращает массив билетов, значение поля `type` которых больше
        переданного значения
      operationId: getTicketsWithTypeGreaterThan
      parameters:
        - name: type
          in: query
          required: true
          description: Тип билета, с которым выполняется сравнение
          schema:
            $ref: '#/components/schemas/TicketType'
          example: USUAL
      responses:
        '200':
          description: Массив билетов с типом больше заданного
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '422':
          description: >-
            Обязательный query-параметр type отсутствует либо отличается от VIP, USUAL, BUDGETARY и
            CHEAP. Сравнение учитывает регистр.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: type должен быть VIP, USUAL, BUDGETARY или CHEAP; получено STANDARD.
                path: /api/v1/tickets/type-greater-than
                violations:
                  - field: type
                    message: type должен быть VIP, USUAL, BUDGETARY или CHEAP; получено STANDARD.
  /sell/{ticket-id}/{person-id}/{price}:
    servers:
      - url: /booking
        description: Сервис продажи билетов и отмены бронирований
    post:
      tags:
        - Booking
      summary: Продать билет
      description: |
        Продаёт указанный билет указанному человеку за переданную сумму.
                Для выполнения операции используется API первого сервиса.
      operationId: sellTicket
      parameters:
        - name: ticket-id
          in: path
          required: true
          description: Идентификатор продаваемого билета
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 10
        - name: person-id
          in: path
          required: true
          description: Идентификатор человека, которому продаётся билет
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 42
        - name: price
          in: path
          required: true
          description: Сумма продажи билета
          schema:
            type: number
            format: double
            minimum: 0
            exclusiveMinimum: true
          example: 2500.5
      responses:
        '204':
          description: Билет успешно продан
        '404':
          description: Билет с переданным положительным id отсутствует в коллекции.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 404
                error: Not Found
                message: Билет с id 10 не найден.
                path: /booking/sell/10/42/100
        '409':
          description: >-
            Для ticket-id уже существует связь с владельцем, включая того же person-id. Повторная
            продажа не выполняется.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 409
                error: Conflict
                message: Билет с id 10 уже продан.
                path: /booking/sell/10/42/100
        '422':
          description: >-
            ticket-id и person-id должны быть целыми int64 > 0; price должен быть конечным числом >
            0 с точкой в качестве десятичного разделителя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: price должен быть больше 0; получено 0.
                path: /booking/sell/10/42/0
                violations:
                  - field: price
                    message: price должен быть больше 0; получено 0.
        '502':
          description: >-
            Не удалось установить соединение с первым сервисом либо его ответ не соответствует
            ожидаемому статусу или схеме Ticket. Изменения связей бронирования не сохраняются.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 502
                error: Bad Gateway
                message: Сервис коллекции билетов не установил соединение.
                path: /booking/sell/{ticket-id}/{person-id}/{price}
  /person/{person-id}/cancel:
    servers:
      - url: /booking
        description: Сервис продажи билетов и отмены бронирований
    delete:
      tags:
        - Booking
      summary: Отменить все бронирования человека
      description: |
        Отменяет все бронирования указанного человека, удаляя его
        идентификатор из всех связанных билетов через API первого сервиса.
      operationId: cancelPersonBookings
      parameters:
        - name: person-id
          in: path
          required: true
          description: Идентификатор человека
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Все бронирования человека успешно отменены
        '422':
          description: person-id должен быть целым числом int64 больше 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 422
                error: Unprocessable Content
                message: person-id должен быть целым числом больше 0; получено -1.
                path: /booking/person/-1/cancel
                violations:
                  - field: person-id
                    message: person-id должен быть целым числом больше 0; получено -1.
        '502':
          description: >-
            Не удалось установить соединение с первым сервисом либо его ответ не соответствует
            ожидаемому статусу или схеме Ticket. Изменения связей бронирования не сохраняются.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                timestamp: 21.09.2026 14:30:00
                status: 502
                error: Bad Gateway
                message: Сервис коллекции билетов не установил соединение.
                path: /booking/person/{person-id}/cancel
components:
  schemas:
    Ticket:
      $ref: ./components/schemas/Ticket.yaml
    Coordinates:
      $ref: ./components/schemas/Coordinates.yaml
    Event:
      $ref: ./components/schemas/Event.yaml
    TicketType:
      $ref: ./components/schemas/TicketType.yaml
    EventType:
      $ref: ./components/schemas/EventType.yaml
    ErrorResponse:
      $ref: ./components/schemas/ErrorResponse.yaml
  parameters:
    ticket:
      name: ticket
      in: query
      required: true
      description: |
        JSON-объект с изменяемыми полями Ticket, закодированный в URL.
        id, creationDate и event.id не передаются (генерируются сервером).
        event может отсутствовать или быть null. Все остальные изменяемые поля обязательны.
        Swagger UI сериализует JSON и кодирует значение параметра автоматически.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ticket'
          example:
            name: Билет в партер
            coordinates:
              x: 10.5
              'y': 20
            price: 2500.5
            comment: Место рядом со сценой
            type: VIP
            event: null
    page:
      $ref: ./components/parameters/Pagination.yaml#/page
    size:
